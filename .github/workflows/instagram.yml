name: Instagram auto-post

# Mon/Wed/Fri/Sat 19:07 KST (10:07 UTC). Posts instagram/queue/<today KST>/ if present.
on:
  schedule:
    - cron: "7 10 * * 1,3,5,6"
  workflow_dispatch:
    inputs:
      date:
        description: "Post date folder (YYYY-MM-DD). Empty = today in KST"
        required: false
      live:
        description: "Really publish (otherwise dry run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Scheduled runs publish only when repo variable IG_LIVE is "true".
          IG_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.live && 'true' || (github.event_name == 'schedule' && vars.IG_LIVE || 'false') }}
          POST_DATE: ${{ inputs.date }}
        run: python3 scripts/ig_post.py
      - name: Record posted
        run: |
          if [ -n "$(git status --porcelain instagram/posted.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add instagram/posted.json
            git commit -m "Record Instagram post"
            git push
          fi
      - name: Refresh token (optional)
        # Instagram tokens last 60 days. If secret IG_SECRET_PAT (a fine-grained token with
        # "Secrets: write" on this repo) is set, renew IG_ACCESS_TOKEN on every run.
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.IG_SECRET_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$IG_ACCESS_TOKEN" ]; then echo "No IG_SECRET_PAT; skipping refresh."; exit 0; fi
          new=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_ACCESS_TOKEN" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))')
          if [ -n "$new" ]; then
            echo "::add-mask::$new"
            gh secret set IG_ACCESS_TOKEN --body "$new" --repo "$GITHUB_REPOSITORY"
            echo "Token refreshed (valid 60 more days)."
          else
            echo "::warning::Token refresh failed. Make a new token in the Meta app if posts start failing."
          fi
